name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, testes e analise de arquitetura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Publicar relatorio de testes
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

      - name: Validar build da imagem Docker
        run: docker build -t orderflow-reconciliation:ci .
